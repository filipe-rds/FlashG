<!DOCTYPE html>
<html lang="pt_BR"
xmlns:th="http://www.thymeleaf.org"  xmlns:layout="https://ultraq.net.nz/web/thymeleaf/layout" 
layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Importando o CoreUI -->
</head>

<body>
    <div layout:fragment="content">
        <div class="container ">
            <div class="overflow-auto " style="max-height:700px; max-width: 1500px;">
                <div class="card mb-3">
                <div class="card-header" style="background-color: black !important; color: white;">
                    <h3>Encontrar Fotógrafos</h3>
                </div>
                <div class="card-body text-primary">
                <form th:action="@{/facade/findPhotographers}" method="GET">
                    <div class = "d-flex">
                    <h5 class="card-title">Pesquisar</h5>
                    <input class = "ms-3"type="text" th:value=${username} id="username" name="username" placeholder="Digite o @"><br><br>
                    <button class="btn btn-outline-success" type="submit">Pesquisar</button>
                </div>
                </div>
                </form>
             </div>  

                <p class = "mt-5" th:if="${message != null and message != '' }" th:text="${message}"></p>
                <p class = "mt-5" th:if="${resultados != null and resultados != '' }" th:text="${resultados}"></p>
                <table class="table table-success" th:if="${photographers != null and photographers.size() > 0}">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Nome</th>
                            <th>Acessar</th>                         
                        </tr>
                    </thead>
                    <tbody>
                        <h3 class="mb-5"  th:text="${photographers.size()+' Fotógrafos'}"></h3>
                        <tr th:each="photographer : ${photographers}">
                            <td th:text="${photographer.username}"></td>
                            <td th:text="${photographer.firstName+' '+photographer.lastName}"></td>
                            <td >
                                <a th:href="@{/facade/showProfile/{id}(id=${photographer.id})}" class="btn btn-outline-success">Acessar</a>
                            </td>
                            <!--
                            <td th:text="${photographer.password}"></td> -->
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
