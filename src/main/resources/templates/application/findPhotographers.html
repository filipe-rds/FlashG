<!DOCTYPE html>
<html lang="pt_BR"
xmlns:th="http://www.thymeleaf.org"  xmlns:layout="https://ultraq.net.nz/web/thymeleaf/layout" 
layout:decorate="~{layout/layout}">
<head>
    <title>FlashG</title>
</head>
<body>
<div layout:fragment="content">
    <div class="overflow-auto max-w-full max-h-screen mx-auto p-4">
        <div class="flex justify-center items-center">
            <div class="w-3/4">
                <!-- Card Header -->
                <div class="mb-5 shadow-lg border rounded-lg">
                    <div class="bg-gray-500 text-white px-6 py-3 rounded-t-lg">
                        <h3 class="text-lg font-semibold m-0">Encontrar Fotógrafos</h3>
                    </div>
                    <div class="bg-white px-6 py-4 text-gray-700">
                        <form th:action="@{/findPhotographers}" method="GET">
                            <div class="flex items-center gap-4">
                                <h5 class="text-base font-semibold">Pesquisar</h5>
                                <input
                                        class="w-full max-w-xs px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-gray-400 transition duration-200"
                                        type="text" th:value="${username}" id="username" name="username" placeholder="Digite o @">
                                <button
                                        class="px-4 py-2 bg-gray-700 text-white text-sm font-medium rounded hover:bg-gray-800 transition duration-200"
                                        type="submit">Pesquisar</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Error Alert -->
                <div
                        class="mb-4 p-4 text-sm bg-red-200 text-red-600 border border-gray-100 rounded-lg "
                        role="alert" th:if="${error}" th:text="${error}">
                </div>

                <!-- Result Summary -->
                <p class="mt-5 text-gray-500 text-sm" th:if="${resultados}" th:text="${resultados}"></p>
                <h3
                        class="mb-5 text-lg font-medium text-gray-800"
                        th:if="${photographers}" th:text="${photographers.size() + ' Fotógrafos'}">
                </h3>

                <!-- Table -->
                <table
                        class="w-full text-left table-auto border-collapse rounded-lg shadow-sm overflow-hidden"
                        th:if="${photographers}">
                    <thead class="bg-gray-200">
                    <tr>
                        <th class="px-4 py-3 text-sm font-medium text-gray-700">Username</th>
                        <th class="px-4 py-3 text-sm font-medium text-gray-700">Nome</th>
                        <th class="px-4 py-3 text-sm font-medium text-gray-700">Acessar</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr
                            th:each="photographer : ${photographers}"
                            class="border-b border-gray-300 hover:bg-gray-100 transition duration-200">
                        <td
                                class="px-4 py-3 text-sm font-semibold italic text-gray-800"
                                th:text="${photographer.username}">
                        </td>
                        <td
                                class="px-4 py-3 text-sm font-semibold text-gray-800"
                                th:text="${photographer.firstName + ' ' + photographer.lastName}">
                        </td>
                        <td class="px-4 py-3">
                            <a
                                    th:href="@{/showProfile/{id}(id=${photographer.id})}"
                                    class="px-3 py-1 text-sm font-medium text-gray-700 border border-gray-700 rounded hover:bg-gray-800 hover:text-white transition duration-200">
                                Acessar
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>


</body>

</html>
