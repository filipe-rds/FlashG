<!DOCTYPE html>
<html lang="pt_BR"
      xmlns:th="http://www.thymeleaf.org"  xmlns:layout="https://ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuida Pai</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div layout:fragment="content">
  <div class="container mt-5">
      <div class="overflow-auto " style="max-height:700px; max-width: 1500px;">
          <div class="d-flex justify-content-center align-items-center">
              <div class="w-75">

                  <h1 class="text-center mb-4">Minhas Fotos</h1>
                  <p class="text-center" th:text="'Bem-vindo, ' + ${photographer.getFirstName()}"></p>

                  <!-- Galeria de Fotos -->
                  <div class="row row-cols-3 g-2">
                      <div class="col" th:each="photo : ${photos}">
                          <div class="card h-100 bg-light">
                              <div class="card-img-top" style="height: 350px; overflow: hidden; aspect-ratio: 1 / 1;">
                                  <img th:src="${photo}" class="img-fluid h-100 w-100 object-fit-cover" alt="Foto do fotógrafo">
                              </div>
<!--                              <div class="card-body d-flex flex-column justify-content-center align-items-center border">-->
<!--                                  <p class="card-text">Texto de descrição vai ficar aqui</p>-->
<!--                              </div>-->
                          </div>
                      </div>
                  </div>

              </div>
          </div>
      </div>
  </div>
</div>



</body>
</html>
