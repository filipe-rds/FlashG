<!DOCTYPE html>
<html lang="pt_BR"
      xmlns:th="http://www.thymeleaf.org" xmlns:layout="https://ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <title>FlashG</title>
</head>
<body>
<div layout:fragment="content">
  <div th:if="${photographer}" class="overflow-auto" style="max-height:700px; max-width: 1500px;">
    <div class="flex justify-center items-center">
      <div class="w-3/4">
        <!-- Card de exibição do perfil -->
        <div class="shadow-lg border border-gray-300 rounded-lg">
          <div class="bg-gray-500 text-white rounded-t-lg p-4">
            <h3 class="text-lg font-bold">Perfil do Fotógrafo</h3>
          </div>
          <div class="flex bg-white p-6 justify-between">
            <!-- Informações do fotógrafo -->
            <div class="mb-4">
              <h3 class="text-2xl font-semibold text-gray-800"
                  th:text="${photographer.firstName} + ' ' + ${photographer.lastName}"></h3>
              <p class="text-lg text-gray-600" th:text="'@' + photographer.username"></p>
            </div>
            <div class="mb-4">
              <span class="text-gray-700 font-semibold">Email:</span>
              <p class="text-gray-600" th:text="${photographer.email}"></p>
            </div>
            <div class="mb-4">
              <span class="text-gray-700 font-semibold">Seguidores:</span>
              <p class="text-gray-600" th:text="${photographer.followers != null ? photographer.followers.size() : 0}"></p>
            </div>
            <div class="mb-4">
              <span class="text-gray-700 font-semibold">Seguindo:</span>
              <p class="text-gray-600" th:text="${photographer.following != null ? photographer.following.size() : 0}"></p>
            </div>
            <div class="mb-4">
              <span class="text-gray-700 font-semibold">Aceita seguidores?</span>
              <p class="text-gray-600" th:text="${photographer.acceptsFollowers ? 'Sim' : 'Não'}"></p>
            </div>
            <!-- Botão de edição, visível apenas para o próprio usuário -->
            <div class="mt-6">
              <a href="#" class="inline-block bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-500">
                Editar Perfil
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
