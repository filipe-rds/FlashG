<!DOCTYPE html>
<html lang="pt_BR"
xmlns:th="http://www.thymeleaf.org"  xmlns:layout="https://ultraq.net.nz/web/thymeleaf/layout" 
layout:decorate="~{layout/layout}">
<head>
    <title>FlashG</title>
</head>
<body>
<div layout:fragment="content">
    <div class="overflow-auto" style="max-height:700px; max-width: 1500px;">
        <div class="flex justify-center items-center">
            <div class="w-3/4">
                <!-- Card para visualização do perfil público -->
                <div class="shadow-lg border border-gray-300 rounded-lg">
                    <div class="bg-gray-500 text-white rounded-t-lg p-4">
                        <h3 class="text-lg font-bold">Perfil do Fotógrafo</h3>
                    </div>
                    <div class=" flex bg-white p-6 justify-between">
                        <!-- Dados do perfil -->
                        <div class="mb-4">
                            <h3 class="text-2xl font-semibold text-gray-800" th:text="${photographer.firstName + ' ' + photographer.lastName}"></h3>
                            <p class="text-lg text-gray-600" th:text="'@' + ${photographer.username}"></p>
                        </div>
                        <div class="mb-4">
                            <h3 class="text-gray-700 text-lg font-semibold" th:text="'Seguidores: ' + ${photographer.followers.size()}"></h3>
                        </div>
                        <div class="mb-4">
                            <h3 class="text-gray-700 text-lg font-semibold" th:text="'Seguindo: ' + ${photographer.following.size()}"></h3>
                        </div>
                        <div class="mb-4">
                            <span class="text-gray-700 font-semibold">Aceita seguidores?</span>
                            <p class="text-gray-600" th:text="${photographer.acceptsFollowers ? 'Sim' : 'Não'}"></p>
                        </div>
                        <!-- Opção de seguir -->
                        <div class="flex items-center">
                            <form th:action="@{/followAction}" method="POST" th:if="${photographer.acceptsFollowers}">
                                <input type="hidden" name="id" th:value="${photographer.id}" />
                                <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-500" type="submit" th:text="${status}">
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


</div>

</body>

</html>
