<!DOCTYPE html>
<html lang="pt_BR"
      xmlns:th="http://www.thymeleaf.org"  xmlns:layout="https://ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuida Pai</title>
</head>
<body>
<div layout:fragment="content">
    <div class="w-full h-full bg-slate-200 flex flex-auto justify-center items-center mb-3 mt-1 pl-3 " >

                    <div class="relative flex flex-col rounded-xl bg-transparent max-w-7xl mx-auto px-6 sm:px-12">
                        <h4 class="block text-2xl font-medium text-slate-800 text-center mb-4">
                            Upload de Foto
                        </h4>

                        <form th:action="@{/uploadPhotos}" method="POST" enctype="multipart/form-data" class=" mt-8 mb-2 w-full h-full max-w-3xl sm:max-w-5xl mx-auto">
                            <div class="mb-4 flex flex-col gap-6">
                                <div class="w-full">
                                    <label for="photo" class="block mb-2 text-sm text-slate-600">
                                        Selecione a foto
                                    </label>
                                    <input type="file" id="photo" th:name="image" accept="image/*" required class="w-full bg-transparent placeholder:text-slate-400 text-slate-700 text-sm border border-slate-200 rounded-md px-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow" placeholder="Selecione a foto" />
                                </div>
                                <div class="w-full  ">
                                    <label for="tittle" class="block mb-2 text-sm text-slate-600">
                                        Titulo
                                    </label>
                                    <input type="text" id="tittle" th:field="*{photo.title}" class="w-full bg-transparent placeholder:text-slate-400 text-slate-700 text-sm border border-slate-200 rounded-md px-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow" placeholder="titulo da foto" />
                                </div>

                                    <div class=" relative w-full">
                                        <textarea class=" peer h-full min-h-[150px] w-full resize-none rounded-[7px] border border-blue-gray-200 border-t-transparent bg-transparent px-3 py-2.5 font-sans text-sm font-normal text-blue-gray-700 outline outline-0 transition-all placeholder-shown:border placeholder-shown:border-blue-gray-200 placeholder-shown:border-t-blue-gray-200 focus:border-2 focus:border-gray-900 focus:border-t-transparent focus:outline-0 disabled:resize-none disabled:border-0 disabled:bg-blue-gray-50" placeholder=" "></textarea>
                                            <label id="description"  th:field="*{photo.description}" class="before:content[' '] after:content[' '] pointer-events-none absolute left-0 -top-1.5 flex h-full w-full select-none text-[11px] font-normal leading-tight text-blue-gray-400 transition-all before:pointer-events-none before:mt-[6.5px] before:mr-1 before:box-border before:block before:h-1.5 before:w-2.5 before:rounded-tl-md before:border-t before:border-l before:border-blue-gray-200 before:transition-all after:pointer-events-none after:mt-[6.5px] after:ml-1 after:box-border after:block after:h-1.5 after:w-2.5 after:flex-grow after:rounded-tr-md after:border-t after:border-r after:border-blue-gray-200 after:transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:leading-[3.75] peer-placeholder-shown:text-blue-gray-500 peer-placeholder-shown:before:border-transparent peer-placeholder-shown:after:border-transparent peer-focus:text-[11px] peer-focus:leading-tight peer-focus:text-gray-900 peer-focus:before:border-t-2 peer-focus:before:border-l-2 peer-focus:before:border-gray-900 peer-focus:after:border-t-2 peer-focus:after:border-r-2 peer-focus:after:border-gray-900 peer-disabled:text-transparent peer-disabled:before:border-transparent peer-disabled:after:border-transparent peer-disabled:peer-placeholder-shown:text-blue-gray-500">
                                                Descrição
                                            </label>
                                    </div>
                            </div>

                            <button class="mt-4 w-full justify-center rounded-md bg-slate-800 py-3 px-6 max-w-sm mx-auto border border-transparent text-center text-sm text-white transition-all shadow-md hover:shadow-lg focus:bg-slate-700 focus:shadow-none active:bg-slate-700 hover:bg-slate-700 active:shadow-none disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none" type="submit">
                                Postar Foto
                            </button>
                            <p class="flex justify-center mt-6 text-sm text-slate-600">
                                Formatos aceitos: JPEG, PNG
                            </p>
                        </form>
                    </div>

    </div>
</div>
</body>
</html>
