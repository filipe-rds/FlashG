<!DOCTYPE html>
<html lang="pt_BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}">
    <title>FlashG | Sign In</title>
</head>
<body class="px-10 pt-10 flex flex-col h-screen">
    <header class="flex justify-between relative">
        <h1 class="text-5xl font-bold">FlashG</h1>

        <a th:href="@{/auth/signup}" class="w-[212px] h-[56px] flex justify-center items-center bg-gray-700 text-white text-xl rounded hover:bg-gray-800 transition-colors"
           role="button">Fazer Cadastro</a>
    </header>

    <main class="flex flex-1 w-full h-full justify-center items-center">
        <div class="flex flex-col gap-10 max-w-[540px]">
            <div class="flex flex-col gap-3">
                <h2 class="text-3xl font-semibold">
                    Que bom ter você de volta!
                </h2>
                <div class="bg-red-300 text-red-600 w-full p-4 rounded" role="alert" th:if="${error}" th:text="${error}"></div>
                <div class="bg-red-300 text-red-600 w-full p-4 rounded" role="alert"  th:if="${param.error}" th:text="${param.error}"></div>
                <div class="bg-green-300 text-green-600 w-full p-4 rounded" role="alert" th:if="${param.logout}">Você saiu com sucesso!</div>
            </div>

            <form th:action="@{/auth/login}"  method="post" class="flex flex-col gap-5">
                <div>
                    <label for="email" class="text-lg block mb-2 font-medium text-zinc-950">Email:</label>
                    <input type="email" id="email" name="email"  placeholder="exemplo@exemplo.com"
                           class="border border-gray-300 text-zinc-950 text-sm rounded-lg focus:outline-gray-800 block w-full p-2.5 transition-all" required>
                </div>
                <div>
                    <label for="password" class="text-lg block mb-2 font-medium text-zinc-950">Senha:</label>
                    <input type="password" id="password" name="password"
                           placeholder="Senha forte com no mínimo 8 dígitos" class="border border-gray-300 text-zinc-950 text-sm rounded-lg focus:outline-gray-800 block w-full p-2.5" required>
                </div>
                <button class="flex justify-center items-center bg-gray-700 w-full py-3 text-white text-xl rounded hover:bg-gray-800 transition-colors mt-2">
                    Logar no Sistema
                </button>
            </form>
        </div>
    </main>
</body>
</html>
