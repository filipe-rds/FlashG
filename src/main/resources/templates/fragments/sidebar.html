<div th:fragment="sidebar">
        <div class="bg-gray-500 relative flex h-full w-full max-w-[20rem] flex-col bg-clip-border p-4 text-white shadow-xl shadow-blue-gray-900/5">
            <div class="p-4 mb-2">
                <h1 class="block font-sans text-2xl antialiased font-semibold leading-snug tracking-normal text-blue-gray-900">
                    FlashG
                </h1>
            </div>

            <div class="p-4 mb-2">
                <div class="flex items-center gap-4">
                    <img th:src="${session.loggedPhotographer.profilePictureUrl}" alt="avatar"
                         class="inline-block relative object-cover object-center !rounded-full w-12 h-12" />
                    <div>
                        <h6 class="text-white font-semibold">
                            <span th:text="${session.loggedPhotographer.firstName+ ' ' +session.loggedPhotographer.lastName}"></span>
                        </h6>
                        <p class="text-slate-800 text-sm">
                            <span th:text="${session.loggedPhotographer.username}"></span>
                        </p>
                    </div>
                </div>
            </div>

            <div class="flex min-w-[240px] flex-col gap-1 p-2 font-sans text-base font-normal text-blue-gray-700">
                <a th:href="@{/myProfile}" role="button"
                     class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 hover:bg-opacity-80 hover:text-blue-gray-900 focus:bg-blue-gray-50 focus:bg-opacity-80 focus:text-blue-gray-900 active:bg-blue-gray-50 active:bg-opacity-80 active:text-blue-gray-900">
                    <div class="grid mr-4 place-items-center">
                        <img th:src="@{/assets/icons/user.svg}" alt="User icon" class="w-[20px] h-[20px]">
                    </div>
                    Meu perfil
                </a>

                <a th:href="@{/uploadPhotos}" role="button"
                   class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 hover:bg-opacity-80 hover:text-blue-gray-900 focus:bg-blue-gray-50 focus:bg-opacity-80 focus:text-blue-gray-900 active:bg-blue-gray-50 active:bg-opacity-80 active:text-blue-gray-900">
                    <div class="grid mr-4 place-items-center">
                        <img th:src="@{/assets/icons/camera.svg}" alt="Camera icon" class="w-[20px] h-[20px]">
                    </div>
                    Publicar foto
                </a>

                <a th:href="@{/listPhotographerFollowers}" role="button"
                     class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 hover:bg-opacity-80 hover:text-blue-gray-900 focus:bg-blue-gray-50 focus:bg-opacity-80 focus:text-blue-gray-900 active:bg-blue-gray-50 active:bg-opacity-80 active:text-blue-gray-900">
                    <div class="grid mr-4 place-items-center">
                        <img th:src="@{/assets/icons/users.svg}" alt="Users icon" class="w-[20px] h-[20px]">
                    </div>
                    Seguidores
                </a>

                <a th:href="@{/listPhotographerFollowing}" role="button"
                   class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 hover:bg-opacity-80 hover:text-blue-gray-900 focus:bg-blue-gray-50 focus:bg-opacity-80 focus:text-blue-gray-900 active:bg-blue-gray-50 active:bg-opacity-80 active:text-blue-gray-900">
                    <div class="grid mr-4 place-items-center">
                        <img th:src="@{/assets/icons/user-check.svg}" alt="User check icon" class="w-[20px] h-[20px]">
                    </div>
                    Seguindo
                </a>

                <a th:href="@{/searchPhotographers}" role="button"
                     class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 hover:bg-opacity-80 hover:text-blue-gray-900 focus:bg-blue-gray-50 focus:bg-opacity-80 focus:text-blue-gray-900 active:bg-blue-gray-50 active:bg-opacity-80 active:text-blue-gray-900">
                    <div class="grid mr-4 place-items-center">
                        <img th:src="@{/assets/icons/search.svg}" alt="Search icon" class="w-[20px] h-[20px]">
                    </div>
                    Buscar fotógrafos
                </a>

                <a role="button" th:href="@{/showAllPhotographers}" sec:authorize="hasRole('ADMIN')"
                     class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 hover:bg-opacity-80 hover:text-blue-gray-900 focus:bg-blue-gray-50 focus:bg-opacity-80 focus:text-blue-gray-900 active:bg-blue-gray-50 active:bg-opacity-80 active:text-blue-gray-900">
                    <div class="grid mr-4 place-items-center">
                        <img th:src="@{/assets/icons/database.svg}" alt="Database icon" class="w-[20px] h-[20px]">
                    </div>
                    Todos fotográfos
                </a>
            </div>
            <div class="pt-20">
                <a th:href="@{/logout}" role="button"
                   class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 hover:bg-opacity-80 hover:text-blue-gray-900 focus:bg-blue-gray-50 focus:bg-opacity-80 focus:text-blue-gray-900 active:bg-blue-gray-50 active:bg-opacity-80 active:text-blue-gray-900">
                    <div class="grid mr-4 place-items-center">
                        <img th:src="@{/assets/icons/log-out.svg}" alt="Log out icon" class="w-[20px] h-[20px]">
                    </div>
                    Logout
                </a>
            </div>
        </div>
</div>
