<!DOCTYPE html>
<html lang="pt_BR" xmlns:layout="https://ultraq.net.nz/web/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/layout}">
<head>
    <title>FlashG | Home</title>
</head>
<body>
    <!-- Conteúdo específico da página -->
    <div layout:fragment="content">
        <div class="w-full h-full flex flex-col justify-center items-center" style="max-height: 700px; max-width: 1500px;">
            <div class="flex items-center w-[80%] gap-8">
                <div>
                    <h1 class="text-5xl font-semibold mb-10">Bem-vindo ao FlashG, compartilhe momento incríveis!</h1>

                    <h2 class="text-base mb-12 text-zinc-800">Descubra, conecte e compartilhe sua paixão pela fotografia com uma comunidade vibrante de artistas visuais.</h2>

                    <a th:href="@{/uploadPhotos}" class="w-[212px] h-[56px] flex justify-center items-center bg-gray-700 text-white text-xl rounded hover:bg-gray-800 transition-colors"
                       role="button">
                        Publicar Foto
                    </a>
                </div>

                <img th:src="@{/assets/Photo.jpg}" alt="" class="w-[400px] h-[480px] rounded">
            </div>
        </div>
    </div>
</body>
</html>
